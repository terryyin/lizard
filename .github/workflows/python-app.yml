name: Python application

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
      - 'feature/**'
    types: [opened, synchronize, reopened, labeled]

# PR comparisons cover the full change from the base branch. Each push has
# its own comparison range, so keep push runs independent.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && (github.event.action != 'labeled' || github.event.label.name == 'ci:windows')
    && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_PROOF_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.duplicate != 'true' }}
    strategy:
      matrix:
        # Keep 3.13 on Ubuntu for the analyzer proof, and exercise the
        # oldest and newest advertised Python versions on the default branch.
        os: >-
          ${{ fromJSON((github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
          || contains(github.event.pull_request.labels.*.name, 'ci:windows'))
          && '["ubuntu-24.04", "windows-latest"]' || '["ubuntu-24.04"]') }}
        python-version: >-
          ${{ fromJSON((github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
          && '["3.8", "3.13", "3.14"]' || '["3.13"]') }}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r dev_requirements.txt

    - name: build and Install
      run: |
        python -m pip install .

    - name: Run tests
      id: pytest
      run: |
        python -m pytest -o junit_family=xunit1 --junitxml=pytest-junit.xml

    # Representative leg: ubuntu-24.04 / 3.13 writes the analyzer suite fragment.
    - name: Set up Node for CI proof
      if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' && matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.13' }}
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Write the CI proof fragments
      if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' && matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.13' }}
      run: |
        python scripts/ci-proof/junit-outcomes.py pytest-junit.xml \
          "${RUNNER_TEMP}/ci-proof-times.tsv" > "${RUNNER_TEMP}/ci-proof-outcomes.tsv"
        node scripts/ci-proof/ci-proof-summary.mjs fragment \
          --outcomes "${RUNNER_TEMP}/ci-proof-outcomes.tsv" \
          --times "${RUNNER_TEMP}/ci-proof-times.tsv" --by-file --unit case \
          --entry test \
          --part 1 --of 1 --attempt "${GITHUB_RUN_ATTEMPT}" \
          --revision "${CI_PROOF_REVISION}" --out "${RUNNER_TEMP}/ci-proof"
    - name: Keep the CI proof fragments
      if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' && matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.13' }}
      uses: actions/upload-artifact@v4
      with:
        name: ci-proof-fragments-build-1-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-proof/
        if-no-files-found: ignore
        retention-days: 1

  changes:
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:windows'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      duplicate: ${{ steps.pull-request.outputs.duplicate }}
      web: ${{ steps.detect.outputs.web }}
    steps:
    - name: Check for a pull request covering this push
      id: pull-request
      if: github.event_name == 'push' && github.ref_name != github.event.repository.default_branch
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        pull_requests=$(gh api --paginate --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
          -f state=open -f head="${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" -F per_page=100)
        duplicate=$(jq -cs --arg sha "$GITHUB_SHA" '
          any(.[][]; .head.sha == $sha and
            (.base.ref == "master" or (.base.ref | startswith("feature/"))))
        ' <<< "$pull_requests")
        echo "duplicate=$duplicate" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4
      if: steps.pull-request.outputs.duplicate != 'true'
      with:
        fetch-depth: 0
    - name: Detect web changes
      id: detect
      if: steps.pull-request.outputs.duplicate != 'true'
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: python3 scripts/web_changes.py "$EVENT" "$BASE" "$HEAD" --default-branch "$DEFAULT_BRANCH"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: website/frontend/package.json
    - name: Use the declared npm
      run: npm install -g "$(node -p "require('./website/frontend/package.json').packageManager")"
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install -r requirements.txt
        npm --prefix website/frontend ci
        npm --prefix website/frontend exec -- playwright install --with-deps chromium
    - name: Build
      run: npm --prefix website/frontend run build
    - name: Browser tests
      id: cucumber
      run: npm --prefix website/frontend run test:e2e -- --format json:reports/cucumber.json
    - name: Keep browser test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: browser-reports
        path: website/frontend/reports/
    - name: Write the CI proof fragments
      if: ${{ !cancelled() && steps.cucumber.outcome != 'skipped' }}
      run: |
        node scripts/ci-proof/cucumber-outcomes.mjs website/frontend/reports/cucumber.json \
          "${RUNNER_TEMP}/ci-proof-times.tsv" > "${RUNNER_TEMP}/ci-proof-outcomes.tsv"
        node scripts/ci-proof/ci-proof-summary.mjs fragment \
          --outcomes "${RUNNER_TEMP}/ci-proof-outcomes.tsv" \
          --times "${RUNNER_TEMP}/ci-proof-times.tsv" --by-file --unit case \
          --entry website/frontend/features \
          --part 1 --of 1 --attempt "${GITHUB_RUN_ATTEMPT}" \
          --revision "${CI_PROOF_REVISION}" --out "${RUNNER_TEMP}/ci-proof"
    - name: Keep the CI proof fragments
      if: ${{ !cancelled() && steps.cucumber.outcome != 'skipped' }}
      uses: actions/upload-artifact@v4
      with:
        name: ci-proof-fragments-web-1-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-proof/
        if-no-files-found: ignore
        retention-days: 1

  ci-proof:
    needs: [changes, build, web]
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.duplicate != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-proof-fragments-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-proof-fragments
      - name: Summarize CI proof
        run: |
          mkdir -p -- "${RUNNER_TEMP}/ci-proof-fragments"
          node scripts/ci-proof/ci-proof-summary.mjs summarize \
            --fragments "${RUNNER_TEMP}/ci-proof-fragments" \
            --expect test=1:case --expect website/frontend/features=1:case \
            --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}" \
            --attempt "${GITHUB_RUN_ATTEMPT}" --revision "${CI_PROOF_REVISION}" \
            --out "${RUNNER_TEMP}/ci-proof-summary.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-proof-summary-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-proof-summary.json
          if-no-files-found: error
          retention-days: 30
